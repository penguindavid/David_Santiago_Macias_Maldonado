<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitud de trabajo - GEOTEX</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Bangers', 'cursive']
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 text-gray-900 font-['Poppins']">

    <header class="bg-white border-b border-gray-300">
        <div class="max-w-4xl mx-auto px-6 py-6 flex justify-between items-center">

            <h1 class="text-4xl font-display">
                GEOTEX
            </h1>

            <a href="index.html"
                class="bg-gray-900 text-white px-5 py-3 rounded-lg hover:bg-gray-700 transition">
                ← Volver
            </a>

        </div>
    </header>


    <main class="max-w-3xl mx-auto px-6 py-12">

        <div class="text-center mb-10">

            <h2 class="text-5xl font-display">
                SOLICITUD DE TRABAJO
            </h2>

            <p class="text-gray-600 mt-3">
                Complete la siguiente información si está interesado en contratar mis servicios.
            </p>

        </div>


        <form class="bg-white border border-gray-300 rounded-2xl p-8 shadow-sm">


            <h3 class="text-2xl font-bold mb-6">
                Información de la empresa
            </h3>


            <div class="space-y-5">

                <div>

                    <label class="block font-semibold mb-2">
                        Nombre de la empresa
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Correo
                    </label>

                    <input
                        type="email"
                        name="correo"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        name="telefono"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400">

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Descripción de la empresa
                    </label>

                    <textarea
                        name="descripcion"
                        rows="3"
                        placeholder="Describa brevemente la empresa..."
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400"></textarea>

                </div>

            </div>


            <div class="border-t border-gray-300 my-8"></div>


            <h3 class="text-2xl font-bold mb-6">
                Solicitud
            </h3>


            <div class="space-y-5">

                <div>

                    <label class="block font-semibold mb-2">
                        Asunto
                    </label>

                    <select
                        name="asunto"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400">

                        <option value="">
                            Seleccione una opción
                        </option>

                        <option value="geologia">
                            Trabajo de Geología
                        </option>

                        <option value="paleontologia">
                            Trabajo de Paleontología
                        </option>

                        <option value="geologia_campo">
                            Geología - Trabajo de campo
                        </option>

                        <option value="geologia_laboratorio">
                            Geología - Trabajo de laboratorio
                        </option>

                        <option value="paleontologia_campo">
                            Paleontología - Trabajo de campo
                        </option>

                        <option value="paleontologia_laboratorio">
                            Paleontología - Trabajo de laboratorio
                        </option>

                    </select>

                </div>


                <div>

                    <label class="block font-semibold mb-2">
                        Mensaje
                    </label>

                    <textarea
                        name="mensaje"
                        rows="6"
                        required
                        placeholder="Explique brevemente el trabajo que necesita..."
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400"></textarea>

                </div>

            </div>


            <button
                type="submit"
                class="w-full mt-8 bg-gray-900 text-white py-4 rounded-lg font-semibold hover:bg-gray-700 transition">

                Enviar solicitud

            </button>

        </form>

    </main>


    <footer class="bg-white border-t border-gray-300 text-center py-6">

        <p class="text-gray-500 text-sm">
            GEOTEX · Geología y Paleontología
        </p>

    </footer>

</body>

</html>
